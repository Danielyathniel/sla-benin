<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galerie photo des étudiants de SIL Campus Bénin en pleine action : cours, projets et vie étudiante.">
    <title>Étudiants en Action - Galerie SIL Campus Bénin</title>
    
    <link rel="stylesheet" href="style.css"> 
    
    <style>
        .gallery-header {
            background-color: #fcefe9; /* Couleur légèrement différente pour les Étudiants */
            padding: 100px 0 50px;
            text-align: center;
            margin-top: 80px; 
        }
        .gallery-header h1 {
            color: #a04000;
            font-size: 3rem;
            font-weight: 800;
        }

        /* Utilise CSS Grid pour que les images s'ajustent automatiquement sur plusieurs colonnes */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

/* Force les conteneurs d'images à avoir une hauteur uniforme */
.gallery-item {
    height: 300px; /* Sur PC/Tablette */
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

/* Assure que l'image couvre entièrement son conteneur sans déborder ni être déformée */
.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* C'est la clé de la responsivité pour l'image elle-même */
    transition: transform 0.5s ease;
}

/* --- Media Queries pour les petits écrans --- */

@media (max-width: 768px) {
    .gallery-item {
        height: 250px; /* Réduit la hauteur sur mobile/tablette */
    }
}

@media (max-width: 480px) {
    .gallery-grid {
        grid-template-columns: 1fr; /* Une seule colonne pour les très petits écrans */
    }
    .gallery-item {
        height: 200px; /* Réduit encore la hauteur */
    }
}
    </style>
</head>
<body>
    
    <section class="gallery-header" data-aos="fade-up">
        <div class="container">
            <h1>Étudiants en Action et Vie de Campus</h1>
            <p>Témoin de l'énergie, de la collaboration et de l'apprentissage de nos étudiants.</p>
        </div>
    </section>

    <section class="gallery-section">
        <div class="container">
            <div class="gallery-grid">
                
                <div class="gallery-item" data-aos="zoom-in">
                    <img src="images/IMG_1015.jpg" alt="Étudiants en pleine discussion">
                    <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
                </div>

                <div class="gallery-item" data-aos="zoom-in" data-aos-delay="100">
                    <img src="images/ALL.jpg" alt="Cours d'Anglais en groupe">
                    <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
                </div>

                <div class="gallery-item" data-aos="zoom-in" data-aos-delay="200">
                    <img src="images/STUDENT_03.jpg" alt="Séance de travail en bibliothèque">
                    <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
                </div>
                
                </div>
        </div>
    </section>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
</body>
</html>
